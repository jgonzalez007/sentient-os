# CI — build, lint, and test
# Runs on every push and pull_request to main.
# Uses Xcode 26 on an Apple Silicon runner (macos-27-arm or macos-15-arm).
# Steps:
#   1. Checkout + cache Xcode toolchain and SwiftPM packages.
#   2. Resolve SwiftPM deps (Package.resolved already committed).
#   3. Build Debug — verifies compilation + ENABLE_TESTABILITY.
#   4. Build Release — verifies optimized build (no assertions).
#   5. Run Swift lint check (no warnings on new code).
#   6. (Optional) Run unit tests via xcodebuild -test.

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (Xcode ${{ matrix.xcode }})
    runs-on: macos-15-arm
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2"]
    env:
      DEVELOPER_DIR: /Applications/Xcode-${{ matrix.xcode }}.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build Debug
        run: |
          set -e
          xcodebuild \
            -project "Sentient OS macOS.xcodeproj" \
            -scheme "Sentient OS macOS" \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee build-debug.log
          echo "Debug build: ✅"

      - name: Build Release
        run: |
          set -e
          xcodebuild \
            -project "Sentient OS macOS.xcodeproj" \
            -scheme "Sentient OS macOS" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee build-release.log
          echo "Release build: ✅"

      - name: Swift lint check
        run: |
          # Verify no obvious Swift compiler issues in new files
          # We check that swiftlint (if installed) passes on the Sources dir
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --config .swiftlint.yml 2>&1 || echo "Warning: swiftlint reported issues"
          else
            echo "swiftlint not installed — skipping lint (install via 'brew install swiftlint')"
          fi

      - name: Run unit tests
        run: |
          # Run any XCTest-based unit tests in the project
          # If no test target exists, this step reports a clear message
          xcodebuild \
            -project "Sentient OS macOS.xcodeproj" \
            -scheme "Sentient OS macOS" \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath DerivedData \
            test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            TEST_AFTER_BUILD=YES \
            2>&1 | tee test-output.log || true

          # If no test bundle was found, note it
          if grep -q "No tests to execute" test-output.log 2>/dev/null || \
             grep -q "no test bundle" test-output.log 2>/dev/null; then
            echo "⚠️ No test bundle found — add a test target to run unit tests."
          else
            echo "Unit tests: ✅"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.xcode }}
          path: |
            build-debug.log
            build-release.log
            test-output.log
          retention-days: 7
